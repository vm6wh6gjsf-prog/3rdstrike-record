<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="app-version" content="v17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3rd対戦記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=17">
<title>3rd対戦記録</title>
</head>
<body>
<main>
<header class="topbar"><h1>3rd対戦記録</h1><span class="version-badge">v17</span></header>

<section id="inputTab" class="tab-panel">
<form id="battleForm">
<div class="card">
<h2>対戦を記録</h2>
<label>自分のキャラ<select id="myCharacter" required></select></label>
<label>相手プレイヤー<select id="opponentPlayer" required></select></label>

<div class="match-box">
<div class="section-heading"><h3>相手キャラ・勝敗</h3><button id="addMatchRow" type="button" class="small-button">＋追加</button></div>
<p class="muted">「勝」「負」を押した回数が、そのまま記録されます。</p>
<div id="matchRows"></div>
</div>
<button class="primary-button record-button" type="submit">戦績に記録する</button>
</div>
</form>

<section class="card">
<div class="section-heading"><h2>戦績</h2></div>
<div id="summary"></div>
<div id="history"></div>
<button id="saveReport" type="button" class="primary-button report-button">戦績レポートに記録する</button>
</section>

<section class="card danger-card">
<h2>戦績データ削除</h2>
<p class="muted">登録した戦績だけをすべて削除します。プレイヤー設定と戦績レポートは残ります。</p>
<button id="deleteRecords" class="danger-button" type="button">戦績をすべて削除</button>
</section>
</section>

<section id="reportTab" class="tab-panel hidden">
<section class="card">
<h2>戦績レポート</h2>
<p class="muted">保存した時点の集計戦績です。現在の戦績を変更しても、保存済みレポートは変わりません。</p>
<div id="reports"></div>
</section>
</section>

<section id="playersTab" class="tab-panel hidden">
<section class="card">
<h2>プレイヤー設定</h2>
<p class="muted">初期状態では「不明」のみ登録されています。</p>
<form id="playerForm" class="inline-form">
<input id="playerName" maxlength="30" placeholder="プレイヤー名" required>
<button class="primary-button" type="submit">追加</button>
</form>
<div id="playerList" class="settings-list"></div>
</section>
<section class="card danger-card">
<h2>プレイヤー設定の初期化</h2>
<p class="muted">「不明」以外のプレイヤーを削除します。該当する戦績の相手プレイヤーは「不明」になります。</p>
<button id="resetPlayers" class="danger-button" type="button">プレイヤーを初期化</button>
</section>
</section>
</main>

<nav class="bottom-nav">
<button class="nav-item active" data-tab="inputTab" type="button">⚔️<span>戦績入力</span></button>
<button class="nav-item" data-tab="reportTab" type="button">📊<span>戦績レポート</span></button>
<button class="nav-item" data-tab="playersTab" type="button">👤<span>プレイヤー設定</span></button>
</nav>
<div id="toast" class="toast"></div>
<script src="app.js?v=17"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body>
</html>
