<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="3rd戦績"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>3rdストライク戦績</title></head><body><main><header class="topbar"><h1>3rdストライク戦績</h1></header>
<section id="battleTab" class="tab-panel"><form id="battleForm"><div class="card"><h2>対戦を記録</h2><label>自分のキャラ<select id="myCharacter" required></select></label><label>相手プレイヤー<select id="opponentPlayer" required></select></label></div>
<div class="card"><div class="section-heading"><h2>相手キャラ・勝敗</h2><button id="addMatchRow" type="button" class="small-button">＋追加</button></div><p class="muted">「勝」「負」を押した回数が、そのまま記録されます。</p><div id="matchRows"></div></div><button class="primary-button" type="submit">この内容を記録する</button></form>
<section class="card"><div class="section-heading"><h2>集計戦績</h2><span id="recordCount" class="muted"></span></div><div id="summary"></div><div id="history"></div></section>
<section class="card danger-card"><h2>戦績データ削除</h2><p class="muted">登録した戦績だけをすべて削除します。キャラ・プレイヤー設定は残ります。</p><button id="deleteRecords" class="danger-button" type="button">戦績をすべて削除</button></section></section>
<section id="playersTab" class="tab-panel hidden"><section class="card"><h2>プレイヤー設定</h2><p class="muted">初期状態では「不明」のみ登録されています。</p><form id="playerForm" class="inline-form"><input id="playerName" maxlength="30" placeholder="プレイヤー名" required><button class="primary-button" type="submit">追加</button></form><div id="playerList" class="settings-list"></div></section><section class="card danger-card"><h2>プレイヤー設定の初期化</h2><p class="muted">「不明」以外を削除します。戦績中の該当プレイヤーは「不明」になります。</p><button id="resetPlayers" class="danger-button" type="button">プレイヤーを初期化</button></section></section>
<section id="charactersTab" class="tab-panel hidden"><section class="card"><h2>キャラ設定</h2><p class="muted">3rdストライクのギルを除く19キャラを初期登録しています。</p><form id="characterForm" class="inline-form"><input id="characterName" maxlength="30" placeholder="キャラクター名" required><button class="primary-button" type="submit">追加</button></form><div id="characterList" class="settings-list"></div></section><section class="card danger-card"><h2>キャラ設定の初期化</h2><p class="muted">追加キャラを削除し、19キャラの初期状態に戻します。</p><button id="resetCharacters" class="danger-button" type="button">キャラ設定を初期化</button></section></section></main>
<nav class="bottom-nav"><button class="nav-item active" data-tab="battleTab" type="button">⚔️<span>戦績</span></button><button class="nav-item" data-tab="playersTab" type="button">👤<span>プレイヤー設定</span></button><button class="nav-item" data-tab="charactersTab" type="button">🥊<span>キャラ設定</span></button></nav><div id="toast" class="toast"></div><script src="app.js"></script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
